<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pip the Skull Baby ★ Junior Dream Engineer</title>
  
  <!-- Curated Google Fonts for Early-Web Indie Elegance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Palette Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cream: '#fff8f1',
            paper: '#fcf6ea',
            berry: '#a34063',
            deepBerry: '#782645',
            bark: '#5c4033',
            softBark: '#8a6a57',
            nightBg: '#181224',
            nightCard: '#251b36',
            nightBorder: '#3b2c54',
            amberGlow: '#ffca58',
            lavenderHaze: '#d9c7ed'
          },
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            bubbly: ['Fredoka', 'system-ui', 'sans-serif'],
            mono: ['Space Mono', 'monospace'],
          },
          boxShadow: {
            'retro': '4px 4px 0px #5c4033',
            'retro-lg': '6px 6px 0px #5c4033',
            'retro-dark': '4px 4px 0px #ffca58',
            'glow': '0 0 25px rgba(255, 202, 88, 0.35)',
          }
        }
      }
    }
  </script>

  <style>
    /* Subtle Vintage Indie Background Texture */
    body {
      background-image: radial-gradient(rgba(163, 64, 99, 0.04) 1px, transparent 0);
      background-size: 24px 24px;
    }
    .dark body {
      background-image: radial-gradient(rgba(255, 202, 88, 0.05) 1px, transparent 0);
      background-size: 24px 24px;
    }

    /* Floating Cloud/Dream Animation */
    @keyframes floaty {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    .animate-floaty {
      animation: floaty 5s ease-in-out infinite;
    }

    /* Custom Selection Color */
    ::selection {
      background-color: #a34063;
      color: #fff8f1;
    }
  </style>
</head>

<body class="bg-cream dark:bg-nightBg text-bark dark:text-amber-100 font-bubbly transition-colors duration-500 min-h-screen selection:bg-berry selection:text-white">

  <!-- ==================== FIXED NAVIGATION & STATUS BAR ==================== -->
  <header class="fixed top-4 inset-x-4 max-w-4xl mx-auto z-50">
    <nav class="flex items-center justify-between px-5 py-3 rounded-2xl bg-cream/80 dark:bg-nightCard/80 backdrop-blur-md border-2 border-bark/20 dark:border-nightBorder shadow-sm">
      
      <!-- Brand & Track Badge -->
      <div class="flex items-center gap-3">
        <span class="w-3 h-3 rounded-full bg-berry animate-pulse"></span>
        <div class="flex flex-col">
          <span class="text-xs uppercase tracking-widest font-bold text-berry dark:text-amberGlow">hax.baby // 2026</span>
          <span class="text-[11px] font-mono text-softBark dark:text-amber-200/70">nursery_dispatch.exe</span>
        </div>
      </div>

      <!-- Controls: Hit Counter + Sound + Theme -->
      <div class="flex items-center gap-3">
        <!-- Vintage Odometer Hit Counter (Side Quest) -->
        <div class="hidden sm:flex items-center gap-1.5 px-3 py-1 rounded-lg bg-bark text-amberGlow dark:bg-black font-mono text-xs tracking-widest shadow-inner">
          <span class="opacity-60 text-[10px]">VISITORS:</span>
          <span id="hitCounter">00042</span>
        </div>

        <!-- Master Sound Toggle (Accessible) -->
        <button id="soundToggle" class="px-3 py-1.5 rounded-xl border-2 border-bark/20 dark:border-nightBorder text-xs font-semibold flex items-center gap-1.5 hover:bg-berry hover:text-white hover:border-berry transition active:scale-95" aria-label="Toggle sound">
          <span id="soundIcon">🔊</span>
          <span id="soundLabel" class="hidden md:inline">Sound ON</span>
        </button>

        <!-- Day / Night Mood Switch -->
        <button id="themeToggle" class="p-1.5 rounded-xl border-2 border-bark/20 dark:border-nightBorder hover:bg-berry hover:text-white hover:border-berry transition text-base active:scale-95" aria-label="Toggle night mode">
          🌙
        </button>
      </div>
    </nav>
  </header>

  <!-- Container Anchor for Next Steps -->
  <main id="app-root" class="pt-28 pb-16 px-6 max-w-4xl mx-auto text-center">
    <div class="py-12 border-2 border-dashed border-bark/20 dark:border-nightBorder rounded-3xl p-8 bg-paper/50 dark:bg-nightCard/30">
      <p class="font-mono text-xs text-berry dark:text-amberGlow uppercase tracking-widest">★ Milestone 1 Initialized ★</p>
      <h2 class="text-2xl sm:text-3xl font-serif font-bold mt-2">Nursery Scaffolding Loaded</h2>
      <p class="text-sm opacity-75 mt-2 font-serif italic">Ready to dock Pip's hero profile, interactive speech bubbles, and sleep creations.</p>
    </div>
  </main>

  <!-- Script placeholder for initial toggles -->
  <script>
    // Theme Switcher Logic
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      themeToggle.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    });

    // Simple Hit Counter increment
    let visits = parseInt(localStorage.getItem('pip_visits') || '42') + 1;
    localStorage.setItem('pip_visits', visits);
    document.getElementById('hitCounter').textContent = String(visits).padStart(5, '0');
  </script>
</body>
</html>
